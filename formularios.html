
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastros - NexaTech</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>NexaTech</h1>
        <p>Tecnologia que conecta você ao futuro.</p>
        <a href="index.html" class="voltar">Voltar ao início</a>
    </header>

    <main class="container">

        <h2>Cadastro de Clientes</h2>
        <p>Preencha seus dados para fazer parte da NexaTech.</p>

        <form>
            <div class="campo">
                <label for="nome">Nome completo:</label>
                <input type="text" id="nome" placeholder="Digite seu nome">
            </div>

            <div class="campo">
                <label for="email">E-mail:</label>
                <input type="email" id="email" placeholder="Digite seu e-mail">
            </div>

            <div class="campo">
                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" placeholder="Digite seu telefone">
            </div>

            <div class="campo">
                <label for="cidade">Cidade:</label>
                <input type="text" id="cidade" placeholder="Digite sua cidade">
            </div>

            <div class="campo">
                <label for="nascimento">Data de nascimento:</label>
                <input type="date" id="nascimento">
            </div>

            <div class="campo">
                <label for="observacoes">Observações:</label>
                <textarea id="observacoes" placeholder="Digite suas observações"></textarea>
            </div>

            <button type="submit">Cadastrar</button>
        </form>

        <h2>Inscrição em Treinamentos</h2>
        <p>Inscreva-se em nossos treinamentos de tecnologia.</p>

        <form>
            <div class="campo">
                <label for="nome-treinamento">Nome:</label>
                <input type="text" id="nome-treinamento" placeholder="Digite seu nome">
            </div>

            <div class="campo">
                <label for="email-treinamento">E-mail:</label>
                <input type="email" id="email-treinamento" placeholder="Digite seu e-mail">
            </div>

            <div class="campo">
                <label for="telefone-treinamento">Telefone:</label>
                <input type="tel" id="telefone-treinamento" placeholder="Digite seu telefone">
            </div>

            <div class="campo">
                <label for="data-treinamento">Data de nascimento:</label>
                <input type="date" id="data-treinamento">
            </div>

            <div class="campo">
                <label for="obs-treinamento">Observações:</label>
                <textarea id="obs-treinamento" placeholder="Digite suas observações"></textarea>
            </div>

            <button type="submit">Enviar inscrição</button>
        </form>

    </main>

    <footer>
        <p>NexaTech - Tecnologia que conecta você ao futuro.</p>
    </footer>

</body>
</html>
